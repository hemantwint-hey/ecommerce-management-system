spring.application.name=ecommerce

# Credentials come only from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD); never commit real values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

project.image=images/

spring.sql.init.mode=never

spring.app.jwtSecret=${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1sb2NhbC11c2Utb25seS0xMjM0NTY3ODkw}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
spring.app.jwtCookieName=springBootEcom
# Cross-site deployments (frontend and backend on different domains) need Secure=true and SameSite=None.
spring.app.jwtCookieSecure=${JWT_COOKIE_SECURE:false}
spring.app.jwtCookieSameSite=${JWT_COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Stripe (test keys from https://dashboard.stripe.com/test/apikeys). Leave empty to disable card payments.
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.currency=${STRIPE_CURRENCY:inr}

logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.example.ecommerce=DEBUG
# 5000 is what Elastic Beanstalk expects; hosts like Render inject PORT instead.
server.port=${PORT:5000}