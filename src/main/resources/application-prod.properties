# Activated with --spring.profiles.active=prod (the Dockerfile does this).
# Every secret must come from the host's environment variables: DB_URL, DB_USERNAME, DB_PASSWORD,
# JWT_SECRET, CORS_ALLOWED_ORIGINS, STRIPE_SECRET_KEY.

# Frontend and backend live on different domains in production, so the auth cookie must be
# sent cross-site, which browsers only allow for Secure + SameSite=None cookies over HTTPS.
spring.app.jwtCookieSecure=true
spring.app.jwtCookieSameSite=None

logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.example.ecommerce=INFO
